name: BALA BTC Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: bala-btc-alerts
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install --no-deps "fyers-apiv3>=3.1.0,<4"
      - name: Near-live BALA refresh loop
        env:
          BALA_SYMBOL: BTCUSDT
          PAPER_INITIAL_BALANCE: '10000'
          PAPER_RISK_PCT: '1.0'
          PAPER_MAX_NOTIONAL_PCT: '25'
          FYERS_SYMBOL: ${{ secrets.FYERS_SYMBOL || 'NSE:NIFTY50-INDEX' }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          KOTAK_API_KEY: ${{ secrets.KOTAK_API_KEY }}
          KOTAK_ACCESS_TOKEN: ${{ secrets.KOTAK_ACCESS_TOKEN }}
          KOTAK_GOLD_MINI_TOKEN: ${{ secrets.KOTAK_GOLD_MINI_TOKEN }}
          KOTAK_CRUDE_OIL_TOKEN: ${{ secrets.KOTAK_CRUDE_OIL_TOKEN }}
        run: |
          set -e
          for cycle in 1 2 3; do
            echo "=== BALA refresh cycle $cycle/3 ==="
            python backend/runner.py

            python - <<'PY'
          import csv, json
          from pathlib import Path
          src=Path('dashboard/paper_trades.json')
          out=Path('dashboard/paper_trades.csv')
          state=json.loads(src.read_text()) if src.exists() else {"trades":[]}
          trades=state.get('trades',[])
          fields=['trade_id','opened_at','side','entry','stop','t1','t2','initial_qty','reason','exits','realized_pnl']
          with out.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields)
              w.writeheader()
              for i,t in enumerate(trades,1):
                  exits=t.get('exits',[])
                  w.writerow({
                      'trade_id': i,
                      'opened_at': t.get('opened_at',''),
                      'side': t.get('side',''),
                      'entry': t.get('entry',''),
                      'stop': t.get('stop',''),
                      't1': t.get('t1',''),
                      't2': t.get('t2',''),
                      'initial_qty': t.get('initial_qty',''),
                      'reason': t.get('reason',''),
                      'exits': json.dumps(exits,separators=(',',':')),
                      'realized_pnl': sum(float(x.get('pnl',0)) for x in exits),
                  })
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/status.json dashboard/paper_trades.json dashboard/paper_trades.csv
            if git diff --cached --quiet; then
              echo "No dashboard change"
            else
              git commit -m "Live BALA dashboard refresh cycle $cycle"
              git pull --rebase origin main
              git push origin HEAD:main
            fi

            if [ "$cycle" -lt 3 ]; then sleep 50; fi
          done
