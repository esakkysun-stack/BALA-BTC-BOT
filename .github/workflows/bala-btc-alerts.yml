name: BALA BTC Alerts

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: bala-btc-alerts
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          # Kotak requires websocket-client >=1.9, while FYERS pins 1.6.1.
          # Install FYERS without its stale pin; the supported 1.9.x client is compatible.
          python -m pip install --no-deps "fyers-apiv3>=3.1.0,<4"
      - name: Run BALA BTC analysis and paper trading
        working-directory: backend
        env:
          BALA_SYMBOL: BTCUSDT
          PAPER_INITIAL_BALANCE: '10000'
          PAPER_RISK_PCT: '1.0'
          PAPER_MAX_NOTIONAL_PCT: '25'
          FYERS_SYMBOL: ${{ secrets.FYERS_SYMBOL || 'NSE:NIFTY50-INDEX' }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          KOTAK_API_KEY: ${{ secrets.KOTAK_API_KEY }}
          KOTAK_ACCESS_TOKEN: ${{ secrets.KOTAK_ACCESS_TOKEN }}
          KOTAK_GOLD_MINI_TOKEN: ${{ secrets.KOTAK_GOLD_MINI_TOKEN }}
          KOTAK_CRUDE_OIL_TOKEN: ${{ secrets.KOTAK_CRUDE_OIL_TOKEN }}
        run: python runner.py
      - name: Commit dashboard and paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/status.json dashboard/paper_trades.json
          git diff --cached --quiet && echo "No dashboard/paper status change" || git commit -m "Update BALA BTC paper status"
          git push
