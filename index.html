<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BALA Trading System</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#171717}.wrap{max-width:760px;margin:0 auto;padding:24px 18px 44px}.panel{background:#fff;border:1px solid #e4e4e7;border-radius:22px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.03)}.card{border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:14px}.name{font-size:18px;font-weight:700;margin-bottom:10px}.status{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;font-weight:700;font-size:15px}.green{background:#e9f9ef;color:#08783e}.red{background:#fff0f0;color:#c62828}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}.login{display:inline-block;margin-top:10px;background:#c77b18;color:white;text-decoration:none;border-radius:999px;padding:11px 18px;font-weight:700}.meta{margin-top:9px;color:#666;font-size:14px}.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer}.hero{margin:34px 4px 0}.hero h1{font-size:34px;margin:0 0 8px}.hero p{margin:0;color:#666;font-size:15px;line-height:1.5}.small{font-size:12px;color:#888;margin-top:18px}.live{color:#08783e;font-weight:700}.paper{color:#666;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <section class="panel" id="dashboard"></section>
  <section class="hero">
    <h1>BALA Trading System</h1>
    <p>Broker and strategy dashboard. Connection labels are dashboard status only; real broker authentication must be connected separately and credentials should never be placed in this HTML file.</p>
    <div class="small">Updated: <span id="updated"></span></div>
  </section>
</div>
<script>
const accounts=[
 {name:'Kite — father',status:'Incorrect api_key or access_token',kind:'red',login:true,meta:'3 strategies · all paper'},
 {name:'Kite — wife (Gold Mini)',status:'Incorrect api_key or access_token',kind:'red',login:true,meta:'1 strategy · all paper'},
 {name:'Kotak Neo',status:'Connected',kind:'green',login:false,meta:'auto-login via TOTP · 4 strategies · 1 live'},
 {name:'Groww',status:'Connected',kind:'green',login:false,meta:'1 strategy · all paper'},
 {name:'Kite — friend',status:'Login expired - log in today',kind:'red',login:true,meta:'5 strategies · all paper'}
];
const root=document.getElementById('dashboard');
root.innerHTML=accounts.map((a,i)=>`<div class="card"><div class="name">${a.name}</div><span class="status ${a.kind}"><span class="dot"></span>${a.status}</span>${a.login?'<br><a class="login" href="#" onclick="demoLogin(event,'+i+')">🔑 Log in</a>':''}<div class="meta">${a.meta}</div></div>`).join('')+
`<div class="actions"><button class="btn" onclick="exportCSV()">↓ Export to Excel</button><button class="btn" onclick="location.reload()">↻ Refresh</button></div>`;
document.getElementById('updated').textContent=new Date().toLocaleString('en-IN');
function demoLogin(e,i){e.preventDefault();alert('Login integration will be connected in the next step. Do not enter broker passwords or API secrets into this page.');}
function exportCSV(){const rows=[['Account','Status','Strategies / Mode'],...accounts.map(a=>[a.name,a.status,a.meta])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bala-trading-dashboard.csv';a.click();URL.revokeObjectURL(a.href)}
</script>
</body>
</html>
